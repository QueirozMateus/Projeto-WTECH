<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
    <defs>
        <linearGradient id="bg-grad-mq" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F172A" />
            <stop offset="50%" stop-color="#1E293B" />
            <stop offset="100%" stop-color="#1E1035" />
        </linearGradient>
        <linearGradient id="ring-grad-mq" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6" />
            <stop offset="50%" stop-color="#00D2FF" />
            <stop offset="100%" stop-color="#C084FC" />
        </linearGradient>
        <filter id="glow-mq" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <rect width="400" height="400" fill="url(#bg-grad-mq)" />
    <!-- AI Neural pattern -->
    <circle cx="200" cy="180" r="140" stroke="#8B5CF6" stroke-opacity="0.15" stroke-dasharray="3 5" />
    <circle cx="200" cy="180" r="105" stroke="url(#ring-grad-mq)" stroke-width="3" stroke-linecap="round" stroke-dasharray="320 40" filter="url(#glow-mq)"/>
    
    <circle cx="200" cy="150" r="46" fill="#1E293B" stroke="#8B5CF6" stroke-width="2" />
    <path d="M125 250 C125 205, 160 200, 200 200 C240 200, 275 205, 275 250 Z" fill="#1E293B" stroke="#8B5CF6" stroke-width="2" />
    
    <text x="200" y="160" font-family="'Inter', sans-serif" font-weight="900" font-size="28" fill="#C084FC" text-anchor="middle" letter-spacing="2">MQ</text>

    <rect x="65" y="320" width="270" height="42" rx="21" fill="#0B0F19" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="1.5" />
    <text x="200" y="346" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#C084FC" text-anchor="middle" letter-spacing="1">MATEUS CORDEIRO QUEIROZ</text>

    <g transform="translate(190, 275)" opacity="0.7">
        <path d="M4 7 L7 3 L13 3 L16 7 L18 7 C19.1 7 20 7.9 20 9 L20 17 C20 18.1 19.1 19 18 19 L2 19 C0.9 19 0 18.1 0 17 L0 9 C0 7.9 0.9 7 2 7 L4 7 Z" fill="#94A3B8"/>
