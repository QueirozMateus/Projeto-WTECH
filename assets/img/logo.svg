<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
    <defs>
        <linearGradient id="wtech-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00D2FF" />
            <stop offset="50%" stop-color="#3A7BD5" />
            <stop offset="100%" stop-color="#00FF88" />
        </linearGradient>
        <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#00FF88" stop-opacity="0.8" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Symbol: Stylized Tech W with nodes -->
    <g transform="translate(15, 12)">
        <!-- Outer Glowing Tech Hex Shield / Polygon background -->
        <rect x="2" y="2" width="92" height="92" rx="22" fill="#0E1626" stroke="url(#wtech-grad)" stroke-width="2.5" />
        
        <!-- W Geometric Shape -->
        <path d="M22 28 L34 68 L48 40 L62 68 L74 28" 
              stroke="url(#wtech-grad)" 
              stroke-width="6.5" 
              stroke-linecap="round" 
              stroke-linejoin="round" 
              fill="none" />
              
        <!-- Connection Nodes -->
        <circle cx="22" cy="28" r="4.5" fill="#00D2FF" />
        <circle cx="34" cy="68" r="4.5" fill="#3A7BD5" />
        <circle cx="48" cy="40" r="5" fill="#00FF88" filter="url(#glow)" />
        <circle cx="62" cy="68" r="4.5" fill="#3A7BD5" />
        <circle cx="74" cy="28" r="4.5" fill="#00FF88" />

        <!-- Accent Circuit Line -->
        <path d="M48 40 L48 24 M48 24 L56 18" stroke="#00FF88" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8"/>
    </g>

    <!-- Typography: WTECH -->
    <text x="125" y="65" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="3">
        W<tspan fill="url(#wtech-grad)">TECH</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="128" y="88" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11.5" fill="#00D2FF" letter-spacing="4">
        SOLUÇÕES EM TECNOLOGIA &amp; IA
    </text>
</svg>

